<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081a2b">
  <title>연회 운영보드</title>
  <link rel="manifest" href="../operation-board.webmanifest">
  <link rel="stylesheet" href="../src/styles/variables.css">
  <link rel="stylesheet" href="../src/styles/dashboard.css">
  <link rel="stylesheet" href="../src/styles/dashboardWidgets.css?v=3">
  <link rel="stylesheet" href="../src/styles/operationBoardPage.css?v=6-voice-reply">
</head>
<body class="operation-board-page">
  <section id="boardLogin" class="board-login" hidden>
    <form id="boardLoginForm" class="board-login-card">
      <span>VENEZIA BANQUET</span><h1>연회 운영보드</h1>
      <label>아이디<input id="boardLoginId" autocomplete="username" required></label>
      <label>비밀번호<input id="boardLoginPassword" type="password" autocomplete="current-password" required></label>
      <p id="boardLoginError" aria-live="polite"></p><button type="submit">로그인</button>
    </form>
  </section>
  <main id="boardApp" class="board-app" hidden>
    <header class="board-app-header">
      <button type="button" data-board-page-step="-1" aria-label="이전 날짜">‹</button>
      <div><small>연회 운영보드</small><strong id="boardDateLabel"></strong></div>
      <button type="button" data-board-page-step="1" aria-label="다음 날짜">›</button>
      <button type="button" data-board-page-today>오늘</button>
    </header>
    <p id="boardSyncStatus" class="board-sync-status">저장된 일정 확인 중</p>
    <section id="todayOperationBoard" class="operation-board" aria-label="운영보드"></section>
    <section id="boardAiPanel" class="board-ai-panel" aria-label="현장 AI 협업">
      <div class="board-ai-voice-settings">
        <button id="boardVoiceReplyButton" type="button" aria-pressed="false">🔊 음성 답변 OFF</button>
        <span id="boardVoiceReplyStatus" aria-live="polite" hidden></span>
      </div>
      <div id="boardVisualCamera" class="board-visual-camera" hidden>
        <video id="boardVisualVideo" autoplay playsinline muted></video>
        <canvas id="boardVisualCanvas" hidden></canvas>
        <div class="board-visual-camera-actions">
          <button id="boardVisualCaptureButton" type="button">AI에게 보여주기</button>
          <button id="boardVisualCloseButton" type="button">카메라 닫기</button>
        </div>
      </div>
      <div id="boardAiResult" class="board-ai-result" aria-live="polite"></div>
      <form id="boardAiForm" class="board-ai-form">
        <button id="boardAssetPhotoButton" class="board-ai-photo-button" type="button" aria-label="자산 사진 선택">🖼️</button>
        <input id="boardAssetPhotoInput" type="file" accept="image/*" capture="environment" hidden>
        <button id="boardVisualCameraButton" class="board-visual-camera-button" type="button">📷 카메라</button>
        <button id="boardSpeechButton" class="board-speech-button" type="button" aria-label="음성 입력">🎤</button>
        <textarea id="boardAiInput" rows="1" maxlength="300" placeholder="오늘 변경사항을 입력하세요..." aria-label="현장 변경사항"></textarea>
        <button type="submit">보내기</button>
        <span id="boardSpeechStatus" class="board-speech-status" aria-live="polite" hidden></span>
      </form>
    </section>
  </main>
  <script src="../src/constants.js"></script>
  <script src="../src/aiKnowledgeRules.js"></script>
  <script src="../src/operationBoard.js?v=5-reminder-storage"></script>
  <script src="../src/pushNotifications.js?v=web-push-v2"></script>
  <script src="../src/operationBoardPage.js?v=9-voice-reply"></script>
</body>
</html>
