<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081a2b">
  <title>연회 운영보드</title>
  <link rel="manifest" href="../operation-board.webmanifest">
  <link rel="stylesheet" href="../src/styles/variables.css">
  <link rel="stylesheet" href="../src/styles/dashboard.css">
  <link rel="stylesheet" href="../src/styles/dashboardWidgets.css?v=setup-timing-buckets-v1">
  <link rel="stylesheet" href="../src/styles/operationBoardPage.css?v=browser-tts-quality-v3">
  <link rel="stylesheet" href="../src/styles/eventAttachments.css?v=event-attachments-v1">
</head>
<body class="operation-board-page">
  <section id="boardLogin" class="board-login" hidden>
    <form id="boardLoginForm" class="board-login-card">
      <span>VENEZIA BANQUET</span><h1>연회 운영보드</h1>
      <label>아이디<input id="boardLoginId" autocomplete="username" required></label>
      <label>비밀번호<input id="boardLoginPassword" type="password" autocomplete="current-password" required></label>
      <p id="boardLoginError" aria-live="polite"></p><button type="submit">로그인</button>
    </form>
  </section>
  <main id="boardApp" class="board-app" hidden>
    <header class="board-app-header">
      <button type="button" data-board-page-step="-1" aria-label="이전 날짜">‹</button>
      <div><small>연회 운영보드</small><strong id="boardDateLabel"></strong></div>
      <button type="button" data-board-page-step="1" aria-label="다음 날짜">›</button>
      <button type="button" data-board-page-today>오늘</button>
    </header>
    <p id="boardSyncStatus" class="board-sync-status">저장된 일정 확인 중</p>
    <section id="todayOperationBoard" class="operation-board" aria-label="운영보드"></section>
    <section id="boardAiPanel" class="board-ai-panel" aria-label="현장 AI 협업">
      <div class="board-ai-voice-settings">
        <button id="boardVoiceReplyButton" type="button" aria-pressed="false">🔊 음성 답변 OFF</button>
        <label for="boardTtsQuality">음성 품질</label>
        <select id="boardTtsQuality">
          <option value="qwen">Qwen</option>
          <option value="browser">브라우저</option>
        </select>
        <label for="boardBrowserVoice">음성</label>
        <select id="boardBrowserVoice"><option value="">자동 추천</option></select>
        <label for="boardTtsRate">속도</label>
        <select id="boardTtsRate">
          <option value="0.9">느리게</option>
          <option value="0.96">보통</option>
          <option value="1.05">빠르게</option>
        </select>
        <button id="boardVoiceTestButton" type="button">음성 테스트</button>
        <span id="boardVoiceReplyStatus" aria-live="polite" hidden></span>
      </div>
      <div id="boardVisualCamera" class="board-visual-camera" hidden>
        <video id="boardVisualVideo" autoplay playsinline muted></video>
        <canvas id="boardVisualCanvas" hidden></canvas>
        <div class="board-visual-camera-actions">
          <button id="boardVisualCaptureButton" type="button">AI에게 보여주기</button>
          <button id="boardVisualCloseButton" type="button">카메라 닫기</button>
        </div>
      </div>
      <div id="boardAiContext" class="board-ai-context" hidden><span id="boardAiContextText"></span><button id="boardAiContextClear" type="button" aria-label="최근 행사 및 세팅 컨텍스트 지우기">×</button></div>
      <div id="boardAiResult" class="board-ai-result" aria-live="polite"></div>
      <div class="board-ai-quick-actions" aria-label="빠른 질문">
        <button type="button" data-mobile-briefing-open>오늘 브리핑 <span data-mobile-ai-briefing-badge hidden>0</span></button>
        <button type="button" data-board-ai-quick="오늘 끝나고 뭘 세팅해야 돼?">오늘 세팅</button>
        <button type="button" data-board-ai-quick="다음 행사 알려줘">다음 행사</button>
        <button type="button" data-board-ai-quick="현재 세팅 뭐야?">현재 세팅</button>
        <button type="button" data-board-ai-quick="자산 찾아줘">자산 찾기</button>
      </div>
      <span id="boardSpeechStatus" class="board-speech-status" aria-live="polite"></span>
      <form id="boardAiForm" class="board-ai-form">
        <div class="board-ai-plus-wrap">
          <button id="boardAiPlusButton" class="board-ai-plus-button" type="button" aria-label="사진 메뉴" aria-expanded="false">＋</button>
          <div id="boardAiPlusMenu" class="board-ai-plus-menu" hidden>
            <button id="boardVisualCameraButton" class="board-visual-camera-button" type="button">📷 사진 촬영</button>
            <button id="boardAssetPhotoButton" class="board-ai-photo-button" type="button">🖼 사진 선택</button>
          </div>
        </div>
        <input id="boardAssetPhotoInput" type="file" accept="image/*" hidden>
        <textarea id="boardAiInput" rows="1" maxlength="300" placeholder="현장 AI에게 물어보기..." aria-label="현장 AI에게 물어보기"></textarea>
        <button id="boardSpeechButton" class="board-field-ai-button" type="button" aria-label="음성 대화 켜기" aria-pressed="false">🎙 음성 OFF</button>
        <button class="board-ai-send-button" type="submit" aria-label="보내기">↑</button>
      </form>
    </section>
  </main>
  <script src="../src/constants.js"></script>
  <script src="../src/eventDisplayUtils.js?v=event-display-v1"></script>
  <script src="../src/venueUtils.js?v=operational-firenze-v1"></script>
  <script src="../src/storage.js?v=attachment-safe-key-v1"></script>
  <script src="../src/eventAttachments.js?v=attachment-safe-key-v1"></script>
  <script src="../src/aiKnowledgeRules.js"></script>
  <script src="../src/beverageInventory.js?v=beverage-demand-rules-v2"></script>
  <script src="../src/operationsAutopilot.js?v=operations-autopilot-v6"></script>
  <script src="../src/operationBoard.js?v=setup-timing-buckets-v1"></script>
  <script src="../src/pushNotifications.js?v=mobile-preview-reminder-v2"></script>
  <script src="../src/boardLayoutRecommendations.js?v=1"></script>
  <script src="../src/settingAdvisor.js?v=3"></script>
  <script src="../src/erpActionRegistry.js?v=multi-step-planner-v1"></script>
  <script src="../src/erpConversationAgent.js?v=multi-step-planner-v1"></script>
  <script src="../src/eventOrderAnalytics.js?v=event-natural-query-plan-v1"></script>
  <script src="../src/operationBoardPage.js?v=multi-step-planner-v1"></script>
</body>
</html>
